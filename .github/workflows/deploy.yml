name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      PUBLIC_ASSET_SOURCE: ${{ vars.PUBLIC_ASSET_SOURCE }}
      PUBLIC_IMAGE_SOURCE: ${{ vars.PUBLIC_IMAGE_SOURCE }}
      PUBLIC_VIDEO_SOURCE: ${{ vars.PUBLIC_VIDEO_SOURCE }}
      PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL }}
      PUBLIC_PROJECT_VIDEO_BASE_URL: ${{ vars.PUBLIC_PROJECT_VIDEO_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install, build, and upload site
        uses: withastro/action@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
