name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PUBLIC_ASSET_SOURCE: remote
      PUBLIC_IMAGE_SOURCE: remote
      PUBLIC_MEDIA_BASE_URL: https://pub-8f9c84a430fe4288a47ed8a11d8c12be.r2.dev
      # Feature videos are intentionally kept out of Git history, so production
      # must resolve them from the published R2 bucket during the build.
      PUBLIC_VIDEO_SOURCE: remote
      PUBLIC_PROJECT_VIDEO_BASE_URL: https://pub-8f9c84a430fe4288a47ed8a11d8c12be.r2.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
