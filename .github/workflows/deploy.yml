name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      PUBLIC_ASSET_SOURCE: remote
      PUBLIC_IMAGE_SOURCE: remote
      PUBLIC_MEDIA_BASE_URL: https://pub-8f9c84a430fe4288a47ed8a11d8c12be.r2.dev
      # Feature videos are intentionally kept out of Git history, so production
      # must resolve them from the published R2 bucket during the Pages build.
      PUBLIC_VIDEO_SOURCE: remote
      PUBLIC_PROJECT_VIDEO_BASE_URL: https://pub-8f9c84a430fe4288a47ed8a11d8c12be.r2.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install, build, and upload site
        uses: withastro/action@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
